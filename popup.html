<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #fff;
    color: #0f1111;
    font-size: 13px;
  }
  .header {
    background: #232f3e;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header img {
    width: 32px;
    height: 32px;
    border-radius: 6px;
  }
  .header-text h1 {
    font-size: 15px;
    font-weight: 700;
    color: #ffa41c;
    line-height: 1.2;
  }
  .header-text p {
    font-size: 11px;
    color: #a0aec0;
  }
  .status {
    padding: 14px 16px;
    border-bottom: 1px solid #e7e7e7;
  }
  .status-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #565959;
    margin-bottom: 8px;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
  }
  .status-label {
    color: #565959;
  }
  .status-value {
    font-weight: 600;
  }
  .status-value.has-data { color: #067d06; }
  .status-value.no-data { color: #888; }
  .actions {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .action-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    text-decoration: none;
    color: #0f1111;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: none;
    font-size: 13px;
    font-family: inherit;
    width: 100%;
    text-align: left;
    transition: background 0.12s;
  }
  .action-link:hover {
    background: #f0f0f0;
  }
  .action-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .action-icon--sns { background: #e6f3e6; color: #067d06; }
  .action-icon--settings { background: #e6ecf3; color: #0066c0; }
  .action-icon--github { background: #f0f0f0; color: #333; }
  .action-desc {
    font-size: 11px;
    color: #565959;
    font-weight: 400;
  }
  .footer {
    padding: 10px 16px;
    border-top: 1px solid #e7e7e7;
    text-align: center;
    font-size: 11px;
    color: #aaa;
  }
  .footer a {
    color: #0066c0;
    text-decoration: none;
  }
  .footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="header">
    <img id="popup-logo" src="icons/icon128.png" alt="">
    <div class="header-text">
      <h1>Subscription Wizard</h1>
      <p>Amazon S&amp;S Price Comparison</p>
    </div>
  </div>

  <div class="status">
    <div class="status-title">Scan Status</div>
    <div class="status-row">
      <span class="status-label">Personal</span>
      <span class="status-value no-data" id="personal-status">No data</span>
    </div>
    <div class="status-row">
      <span class="status-label">Business</span>
      <span class="status-value no-data" id="business-status">No data</span>
    </div>
  </div>

  <div class="actions">
    <button class="action-link" id="go-sns">
      <span class="action-icon action-icon--sns">&#x1F4E6;</span>
      <span>
        Go to Subscribe &amp; Save
        <span class="action-desc">Open your subscriptions page</span>
      </span>
    </button>
    <button class="action-link" id="go-settings">
      <span class="action-icon action-icon--settings">&#x2699;</span>
      <span>
        Settings
        <span class="action-desc">Manage data, diagnostics &amp; support</span>
      </span>
    </button>
    <button class="action-link" id="go-github">
      <span class="action-icon action-icon--github">&#x2B50;</span>
      <span>
        Rate &amp; Review
        <span class="action-desc">Help others discover this extension</span>
      </span>
    </button>
  </div>

  <div class="footer" id="footer"></div>

  <script src="popup.js"></script>
</body>
</html>
